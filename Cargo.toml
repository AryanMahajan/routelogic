[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
authors = ["Aryan Mahajan"]
license = "MIT"
repository = "https://github.com/AryanMahajan/routelogic"
homepage = "https://github.com/AryanMahajan/routelogic"
description = "Local-first API client that discovers HTTP endpoints from source code — FastAPI, Flask, Django, Express, Next.js — and lets you test them immediately."
keywords = ["api-client", "openapi", "fastapi", "django", "express"]
categories = ["development-tools", "web-programming::http-client", "command-line-utilities"]

[workspace.dependencies]
rl-model = { path = "crates/rl-model" }
rl-discovery = { path = "crates/rl-discovery" }
rl-import = { path = "crates/rl-import" }
rl-http = { path = "crates/rl-http" }
rl-flow = { path = "crates/rl-flow" }
rl-workspace = { path = "crates/rl-workspace" }
rl-core = { path = "crates/rl-core" }
rl-mcp = { path = "crates/rl-mcp" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
